<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Series de Televisión</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background-color: #ffffff;
      }
      .serie-fila {
        cursor: pointer;
      }
      .serie-fila:hover {
        background-color: #f2f2f2;
      }
      #serie-detalle {
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <header>
        <h1 class="text-center mb-5">Catálogo de Series</h1>
      </header>
      <main>
        <div class="row">
          <div class="col-md-7">
            <section>
              <table class="table table-hover">
                <thead class="thead-dark">
                  <tr>
                    <th scope="col">#</th>
                    <th scope="col">Name</th>
                    <th scope="col">Channel</th>
                    <th scope="col">Seasons</th>
                  </tr>
                </thead>
                <tbody id="contenido-series"></tbody>
              </table>
              <div class="text-right font-weight-bold" id="promedio-temporadas"></div>
            </section>
          </div>
          <div class="col-md-5">
            <div id="serie-detalle" class="card">
            </div>
          </div>
        </div>
      </main>
    </div>
    
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
